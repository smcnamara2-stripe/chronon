repos:
  - repo: local
    hooks:
      - id: black
        name: black
        language: system
        entry: black
        require_serial: true
        types_or:
        - python
        - pyi
      - id: isort
        name: isort
        language: system
        entry: isort
        require_serial: true
        types_or:
        - python
        - pyi
        files: ^(ai)/
        args: [--profile=black]
